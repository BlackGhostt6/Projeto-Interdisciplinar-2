<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/fav.png') }}" type="image/x-png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"/>
    <script src="https://kit.fontawesome.com/a3a9f84800.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Cadastro</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <section id="cadastro">
        <h1>Cadastro</h1>
        {% if erro %}
            <p class="erro-msg">{{ erro }}</p>
        {% endif %}
        <form id="cadastro-form" method="POST" autocomplete="off" action="/cadastrar-user">
            <label for="nome">nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu primeiro nome" autocomplete="off" required>
            <label for="user">Usuário</label>
            <input type="text" id="username" name="username" placeholder="Digite um nome de usuário" autocomplete="off" required>

            <label for="email">E-mail:</label>
            <div class="email-row">
                <input type="email" id="email" name="email" placeholder="Digite seu email" autocomplete="off" required>
                <button type="button" id="enviar-codigo-btn" class="inline-action-btn">Enviar</button>
            </div>

            <div id="codigo-verificacao-row" class="codigo-row" hidden>
                <input type="text" id="codigo_verificacao" name="codigo_verificacao" maxlength="6" placeholder="Código de 6 dígitos" autocomplete="off">
                <button type="button" id="validar-codigo-btn" class="inline-action-btn secondary">Validar</button>
            </div>

            <label for="senha">Crie sua senha:</label>
                <div class="senha-container">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    <button type="button" id="toggleSenha" aria-label="Mostrar senha">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
            <label class="lgpd-box" for="aceita_termos">
                <input type="checkbox" id="aceita_termos" name="aceita_termos" required>
                <span>Concordo com o tratamento dos meus dados e com a política de privacidade/LGPD.</span>
            </label>
            <label class="login">
                <p>Já possui uma conta? <a href="{{ url_for('routes.login') }}">Clique aqui.</a></p>
            </label>
            <div id="botoes">
                <button class="btn" id="login-btn" type="submit" disabled>Criar conta</button>
                <button class="btn" id="login-theme-btn" type="button"><i id="theme-icon" class="fas fa-moon"></i></button>
            </div>
        </form>
    </section>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
