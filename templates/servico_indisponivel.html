<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <title>Serviço temporariamente indisponível | PlannerTrip</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        main {
            width: min(100%, 32rem);
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
        }

        h1 {
            margin-top: 0;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
        }

        a:focus-visible {
            outline: 3px solid #f8fafc;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Serviço temporariamente indisponível</h1>
        <p>Não foi possível acessar o banco de dados agora. Aguarde alguns segundos e tente novamente.</p>
        <a href="{{ request.url }}">Tentar novamente</a>
    </main>
</body>
</html>
